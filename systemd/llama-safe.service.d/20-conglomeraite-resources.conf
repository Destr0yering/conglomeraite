# Drop-in only: keep the operator's existing llama-safe.service ExecStart and model.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=3

[Service]
Slice=conglomeraite.slice
MemoryAccounting=yes
# Conservative 8 GB Jetson starting point; benchmark and tune for the pinned model.
MemoryHigh=4608M
MemoryMax=5376M
MemorySwapMax=3072M
OOMScoreAdjust=500
OOMPolicy=stop
TasksMax=256
LimitNOFILE=65536
Restart=on-failure
RestartSec=20s
TimeoutStopSec=45s
KillMode=mixed
