# Target-specific drop-in for the observed Jetson Nano llama.service.
# It preserves the pinned model/runtime arguments while making the listener
# loopback-only and applying the same bounded cgroup policy as llama-safe.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=3

[Service]
ExecStart=
ExecStart=/home/destro/llama.cpp/build/bin/llama-server -m /home/destro/models/qwen/qwen.gguf --host 127.0.0.1 --port 8080 --ctx-size 2048 --n-gpu-layers 8 --threads 6 --batch-size 128 --parallel 1
Slice=conglomeraite.slice
MemoryAccounting=yes
MemoryHigh=4608M
MemoryMax=5376M
MemorySwapMax=3072M
OOMScoreAdjust=500
OOMPolicy=stop
TasksMax=256
LimitNOFILE=65536
Restart=on-failure
RestartSec=20s
TimeoutStopSec=45s
KillMode=mixed
